[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc311-analytics"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "python-dotenv>=1.0,<2", "mysql-connector-python>=8.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
